name: PULSEIQ checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pulseiq_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pulseiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulseiq_test -d pulseiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          PULSEIQ_TEST_DATABASE_URL: postgresql://pulseiq_test:ci-only-password@localhost:5432/pulseiq_test
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py --output qa-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: qa-output
      - run: docker build -t pulseiq:ci .
