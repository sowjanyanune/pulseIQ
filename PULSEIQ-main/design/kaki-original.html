<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PulseIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: dark ink sidebar + pale workspace; a heartbeat line is the brand motif; red/amber/green are reserved for risk and status only. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface2:#E8EEEC; --ink:#0E1D22; --muted:#56696E; --line:#D5DEDC;
  --accent:#0A7D77; --accent-ink:#FFFFFF; --accent-soft:#D6EFEB;
  --good:#17804A; --good-soft:#DAF1E3; --warn:#9A6205; --warn-soft:#FAEBC8; --bad:#BE3A3A; --bad-soft:#F8DADA;
  --side:#0C1A1F; --side-ink:#C8D6D8; --side-mut:#6F878B; --side-act:#17302F; --side-line:#1C2F34;
  --c1:#0A7D77; --c2:#4254C5; --c3:#C27A0E; --c4:#C2477A; --c5:#5F7378; --c6:#7A4FBF;
  --shadow:0 1px 2px rgba(14,29,34,.06),0 10px 28px rgba(14,29,34,.07);
  --f-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-b:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1215; --surface:#101C20; --surface2:#172A2F; --ink:#E5EEED; --muted:#8CA1A4; --line:#24373C;
  --accent:#3CC4B8; --accent-ink:#06201E; --accent-soft:#12383A;
  --good:#4FCB86; --good-soft:#12301F; --warn:#E6A93E; --warn-soft:#3A2B0C; --bad:#F07878; --bad-soft:#3C1A1A;
  --side:#070F12; --side-act:#13292A; --side-line:#14262A;
  --c1:#3CC4B8; --c2:#8C9BFF; --c3:#E6A93E; --c4:#F08AB4; --c5:#8CA1A4; --c6:#B48CF0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1215; --surface:#101C20; --surface2:#172A2F; --ink:#E5EEED; --muted:#8CA1A4; --line:#24373C;
  --accent:#3CC4B8; --accent-ink:#06201E; --accent-soft:#12383A;
  --good:#4FCB86; --good-soft:#12301F; --warn:#E6A93E; --warn-soft:#3A2B0C; --bad:#F07878; --bad-soft:#3C1A1A;
  --side:#070F12; --side-act:#13292A; --side-line:#14262A;
  --c1:#3CC4B8; --c2:#8C9BFF; --c3:#E6A93E; --c4:#F08AB4; --c5:#8CA1A4; --c6:#B48CF0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-d);font-weight:700;margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{flex:none;vertical-align:middle}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.badge-dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;font-weight:600}
/* form */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp,.sel,.txt{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.inp:focus,.sel:focus,.txt:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.txt{min-height:84px;resize:vertical}
.err{color:var(--bad);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px}
input[type=range]{accent-color:var(--accent);width:100%}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.high,.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.med,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.low,.pill.good{background:var(--good-soft);color:var(--good)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.tag{display:inline-block;font-family:var(--f-m);font-size:11px;letter-spacing:.04em;padding:2px 7px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:var(--surface)}
/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card h3{font-size:16px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:13px;margin-top:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-d);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;font-weight:600;position:sticky;top:0}
th.srt{cursor:pointer;user-select:none}
th.srt:hover{color:var(--accent)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:var(--accent-soft)}
td .sub{color:var(--muted);font-size:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-top:12px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
/* bars */
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hb .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;display:flex}
.hb .fl{height:100%;border-radius:5px}
.hb.clk{cursor:pointer;border-radius:6px}
.hb.clk:hover{background:var(--accent-soft)}
.stk span{height:100%;display:block}
.div-row{display:grid;grid-template-columns:minmax(96px,140px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.div-row .tr{position:relative;height:16px}
.div-row .tr::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.5}
.div-row .b{position:absolute;top:2px;height:12px;border-radius:3px}
.svgc{width:100%;height:auto;display:block}
.svgc text{font-family:var(--f-m);font-size:10.5px;fill:var(--muted)}
.svgc .gl{stroke:var(--line);stroke-width:1}
.svgc .pt{cursor:pointer}
.svgc .pt:hover{stroke:var(--ink);stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat td{text-align:center;font-family:var(--f-m);font-size:13px}
.heat td:first-child{text-align:left;font-family:var(--f-b)}
/* shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 12px;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-family:var(--f-d);font-weight:700;font-size:20px;color:#fff;letter-spacing:-.01em}
.brand svg{flex:none}
.rolechip{margin:0 8px 8px;padding:8px 10px;border:1px solid var(--side-line);border-radius:8px;font-size:12px;color:var(--side-mut)}
.rolechip b{display:block;color:#fff;font-size:13px;font-weight:600}
.ng{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-mut);padding:12px 10px 4px;font-weight:600}
.nl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:13.5px}
.nl:hover{background:var(--side-act);color:#fff}
.nl.on{background:var(--side-act);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nl .cd{margin-left:auto;font-family:var(--f-m);font-size:10px;color:var(--side-mut)}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--side-line)}
.main{min-width:0;display:flex;flex-direction:column}
.navscrim{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.top .ttl{font-family:var(--f-d);font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsw{position:relative;flex:1;max-width:380px;margin-left:auto}
.gsw .inp{padding-left:34px}
.gsw .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gsr{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:30;overflow:hidden}
.gsr button{display:flex;width:100%;justify-content:space-between;gap:8px;padding:9px 12px;border:0;background:none;cursor:pointer;text-align:left}
.gsr button:hover{background:var(--accent-soft)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--f-d);flex:none}
.page{padding:24px;display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:26px}
.ph p{color:var(--muted);margin-top:4px;max-width:70ch}
.ph .tag{margin-bottom:8px}
.menubtn{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .fld{min-width:140px}
.toolbar .grow{flex:1;min-width:200px}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(6,14,17,.55);z-index:60;display:flex;justify-content:flex-end}
.scrim.mid{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--bg);width:min(580px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:22px;border:1px solid var(--line);box-shadow:var(--shadow)}
.modal.wide{width:min(760px,100%)}
#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}
.gauge{position:relative;display:grid;place-items:center}
.gauge .gv{position:absolute;text-align:center}
.gauge .gv b{font-family:var(--f-d);font-size:30px;display:block;line-height:1}
.gauge .gv span{font-size:11px;color:var(--muted)}
.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:13.5px}
.callout.bad{border-left-color:var(--bad)} .callout.warn{border-left-color:var(--warn)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.seg{display:flex;gap:10px;align-items:flex-start}
.seg i{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none}
.sbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;min-width:60px}
.sbar b{display:block;height:100%;border-radius:3px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent);transition:width .3s}
.tt{display:grid;grid-template-columns:70px repeat(5,minmax(0,1fr));gap:6px;font-size:12.5px}
.tt>div{padding:8px;border-radius:7px;background:var(--surface2);min-height:44px}
.tt .hd{background:none;font-weight:600;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.06em;min-height:0}
.tt .cl{background:var(--accent-soft);color:var(--ink)}
.tt .cl small{display:block;color:var(--muted)}
.tt .ex{background:var(--warn-soft)}
/* landing + auth */
.land{min-height:100vh;display:flex;flex-direction:column}
.l-nav{display:flex;align-items:center;justify-content:space-between;padding:18px max(16px,5vw)}
.l-nav .brand{color:var(--ink);padding:0}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;padding:40px max(16px,5vw) 56px;align-items:center}
.hero h1{font-size:clamp(34px,4.6vw,56px);letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:17px;color:var(--muted);margin:18px 0 26px;max-width:54ch}
.ecg{width:100%;height:56px;margin-top:30px}
.ecg path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:dr 2.6s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.band{padding:44px max(16px,5vw);border-top:1px solid var(--line);background:var(--surface)}
.band h2{font-size:26px;margin-bottom:22px}
.src{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.auth{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:100vh}
.auth-l{background:var(--side);color:var(--side-ink);padding:40px max(16px,4vw);display:flex;flex-direction:column;gap:20px;justify-content:space-between}
.auth-l h2{color:#fff;font-size:30px;max-width:16ch}
.auth-r{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth-card{width:min(440px,100%);display:flex;flex-direction:column;gap:16px}
.det{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500}
.det.no{background:var(--surface2);color:var(--muted)}
.demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.demo button{border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;cursor:pointer;text-align:left;font-size:12.5px;color:var(--muted)}
.demo button b{display:block;color:var(--ink);font-size:13px}
.demo button:hover{border-color:var(--accent)}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.welc{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:22px;letter-spacing:-.02em}
@media (max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:70;transform:translateX(-100%);transition:transform .2s}
  .app.nav-open .side{transform:none}
  .navscrim{display:none}
  .app.nav-open .navscrim{display:block;position:fixed;inset:0;background:rgba(6,14,17,.5);z-index:65}
  .menubtn{display:inline-grid}
  .top{padding:10px 16px}.page{padding:16px}
  .hero,.auth{grid-template-columns:minmax(0,1fr)}
  .auth-l{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.g4,.g6{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.demo{grid-template-columns:minmax(0,1fr)}.hb{grid-template-columns:90px minmax(0,1fr) auto}.tt{grid-template-columns:48px repeat(5,minmax(0,1fr));font-size:11px}.tt>div{padding:5px}.gsw{display:none}.kpi .v{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ecg path{stroke-dashoffset:0}}
</style>
<div id="root"></div><div id="drawer"></div><div id="modal"></div><div id="toasts" aria-live="polite"></div>
<script>
/* ===== PulseIQ data layer: sample data stands in for the unified student view the database will supply ===== */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const PILLARS=[

 {k:'attendance',label:'Attendance',short:'Attend',w:.15,desc:'Overall attendance across subjects',src:'Attendance'},

const SEGS=[
 {k:'critical',label:'Critical support',color:'--bad',desc:'High academic risk with weak attendance or multiple backlogs. Needs a mentor this week.',action:'Assign a mentor, parent meeting, attendance and remedial plan.'},
 {k:'gap',label:'Academic strong, placement gap',color:'--c3',desc:'Good grades but low aptitude, coding or interview readiness.',action:'Aptitude and coding prep track, mock interviews, certification push.'},
 {k:'slip',label:'Placement-ready, academics slipping',color:'--c2',desc:'Strong placement indicators but weak academic standing.',action:'Backlog clearing plan and subject tutoring before placement season.'},
 {k:'disengaged',label:'Disengaged',color:'--c4',desc:'Low LMS activity and little participation outside class.',action:'Mentor check-in, club or event nomination, LMS nudges.'},
 {k:'star',label:'Star performers',color:'--c1',desc:'High success score with no risk flags.',action:'Peer-mentor role, research or hackathon opportunities.'},
 {k:'steady',label:'Steady core',color:'--c5',desc:'Mid-range on most indicators. Monitor, no action needed yet.',action:'Routine monitoring.'}];
const SEGMAP=Object.fromEntries(SEGS.map(s=>[s.k,s]));

function pillars(s){
  const cg=cl((s.cgpa-4)/6*100,0,100);
  const p={};
  p.academic=.55*cg+.25*s.internal+.20*(100-Math.min(s.backlogs,4)*25);
  p.attendance=cl((s.att-50)/45*100,0,100);
  p.lms=.5*Math.min(s.lms.logins/15,1)*100+.5*s.lms.assign;
  p.engagement=Math.min(100,s.eng.events*6+s.eng.clubs*10+s.eng.hack*10+s.eng.certs*8);
  p.placement=.35*s.plc.apt+.40*s.plc.code+.25*s.plc.mock;
  p.skills=.6*s.skills.tech+.4*s.skills.soft;
  p.feedback=(s.fb.sat+s.fb.fac)/10*100;
  Object.keys(p).forEach(k=>p[k]=r1(p[k]));
  return p;
}
STUDENTS.forEach(s=>s.p=pillars(s));

const S0={W:Object.fromEntries(PILLARS.map(p=>[p.k,p.w])),R:{att:75,acHi:50,acMed:38,plHi:54,plMed:44}};
let MEAN={};
const acadRisk=s=>cl(100-(.45*s.p.academic+.30*s.p.attendance+.15*s.p.lms+.10*s.p.feedback)+Math.min(s.backlogs,3)*4,0,100);
const plcRisk=s=>cl(100-(.65*s.p.placement+.25*s.p.skills+.10*s.p.engagement),0,100);
const flag=(v,hi,med)=>v>=hi?'High':v>=med?'Medium':'Low';
function segOf(s){
  const r=s.risk;
  if(r.acad==='High'&&(s.att<70||s.backlogs>=2))return'critical';
  if(s.p.academic>=62&&s.p.placement<48)return'gap';
  if(s.p.placement>=52&&s.p.academic<58)return'slip';
  if(s.p.lms<58&&s.p.engagement<42)return'disengaged';
  if(s.score>=SC_STAR&&r.acad==='Low'&&r.plc==='Low')return'star';
  return'steady';
}
let SC_STAR=65;
function recompute(W=S0.W,R=S0.R){
  const tw=Object.values(W).reduce((a,b)=>a+b,0)||1;
  STUDENTS.forEach(s=>{s.score=r1(PILLARS.reduce((a,p)=>a+W[p.k]*s.p[p.k],0)/tw)});
  MEAN={};PILLARS.forEach(p=>MEAN[p.k]=mean(STUDENTS.map(s=>s.p[p.k])));
  MEAN.score=mean(STUDENTS.map(s=>s.score));MEAN.bl3=mean(STUDENTS.map(s=>Math.min(s.backlogs,3)));
  MEAN.cgpa=mean(STUDENTS.map(s=>s.cgpa));MEAN.att=mean(STUDENTS.map(s=>s.att));
  STUDENTS.forEach(s=>{s.acad=r1(acadRisk(s));s.plcR=r1(plcRisk(s));s.risk={acad:flag(s.acad,R.acHi,R.acMed),plc:flag(s.plcR,R.plHi,R.plMed)}});
  SC_STAR=[...STUDENTS].map(s=>s.score).sort((a,b)=>b-a)[Math.floor(STUDENTS.length*.2)];
  STUDENTS.forEach(s=>{s.seg=segOf(s)});
}
function scoreDrivers(s,W=S0.W){
  const tw=Object.values(W).reduce((a,b)=>a+b,0)||1;
  return PILLARS.map(p=>({k:p.k,label:p.label,val:s.p[p.k],avg:MEAN[p.k],c:W[p.k]/tw*(s.p[p.k]-MEAN[p.k])})).sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
}
const RT={
 acad:[['Academics',.45,'academic'],['Attendance',.30,'attendance'],['LMS activity',.15,'lms'],['Feedback',.10,'feedback']],
 plc:[['Placement readiness',.65,'placement'],['Skills',.25,'skills'],['Engagement',.10,'engagement']]};
function riskDrivers(s,type){
  const out=RT[type].map(([l,c,k])=>({label:l,k,val:s.p[k],avg:MEAN[k],c:c*(MEAN[k]-s.p[k])}));
  if(type==='acad')out.push({label:'Backlogs',k:'backlogs',val:s.backlogs,avg:MEAN.bl3,c:(Math.min(s.backlogs,3)-MEAN.bl3)*4,raw:true});
  return out.sort((a,b)=>b.c-a.c);
}

}

 engagement:'Nominate for a club or the next hackathon',

 skills:'Soft-skill workshop and a technical skills reassessment',
 feedback:'Faculty and student check-in on satisfaction concerns',
 backlogs:'Backlog clearing plan with a supplementary exam schedule'};
function actionsFor(s){
  const all=[...riskDrivers(s,'acad'),...riskDrivers(s,'plc')].filter(d=>d.c>1.2).sort((a,b)=>b.c-a.c);
  const seen=new Set(),out=[];
  all.forEach(d=>{if(!seen.has(d.k)&&out.length<4){seen.add(d.k);out.push({k:d.k,text:ACTION[d.k]})}});
  return out;
}

const WEEKS=['W1','W2','W3','W4','W5','W6','W7','W8'];
function weekly(){
  const rr=mulberry32(77);
  const endAtt=MEAN.att,endScore=MEAN.score,endHigh=STUDENTS.filter(s=>s.risk.acad==='High').length;
  const att=[],sc=[],hi=[];
  for(let i=0;i<8;i++){const t=7-i;att.push(r1(endAtt+t*.7+(rr()-.5)*1.4-(t>3?1.5:0)));sc.push(r1(endScore-t*.35+(rr()-.5)*.8));hi.push(r0(endHigh-t*1.6+(rr()-.5)*4));}
  att[7]=r1(endAtt);sc[7]=r1(endScore);hi[7]=endHigh;
  return{att,sc,hi};
}

/* ===== charts (SVG + CSS, all colours from tokens) ===== */
function hbars(items,opt={}){
  const mx=opt.max||Math.max(...items.map(i=>i.v),1);
  return items.map(i=>`<div class="hb ${i.act?'clk':''}" ${i.act?`data-act="${i.act}" data-v="${esc(i.key||'')}"`:''}><span>${esc(i.label)}</span><div class="tr"><div class="fl" style="width:${Math.max(i.v/mx*100,1)}%;background:var(${i.color||'--accent'})"></div></div><b class="mono">${i.txt??i.v}</b></div>`).join('');
}
function stacked(parts){const t=parts.reduce((a,p)=>a+p.v,0)||1;return`<div class="tr" style="height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;display:flex">${parts.map(p=>`<span title="${esc(p.label)}: ${p.v}" style="width:${p.v/t*100}%;background:var(${p.color})"></span>`).join('')}</div>`}
function hist(vals,bins=10,lo=0,hi=100){
  const w=640,h=200,pl=26,pb=22,pt=16,cnt=Array(bins).fill(0);
  vals.forEach(v=>cnt[Math.min(bins-1,Math.max(0,Math.floor((v-lo)/(hi-lo)*bins)))]++);
  const mx=Math.max(...cnt,1),bw=(w-pl)/bins;
  let o=`<svg class="svgc" viewBox="0 0 ${w} ${h}" role="img" aria-label="Score distribution">`;
  [0,.5,1].forEach(t=>{const y=h-pb-t*(h-pb-pt);o+=`<line class="gl" x1="${pl}" x2="${w}" y1="${y}" y2="${y}"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${Math.round(mx*t)}</text>`});
  cnt.forEach((c,i)=>{const mid=lo+(i+.5)*(hi-lo)/bins,col=mid>=72?'--good':mid>=58?'--c1':mid>=45?'--warn':'--bad',bh=c/mx*(h-pb-pt),x=pl+i*bw+3;
    o+=`<rect x="${x}" y="${h-pb-bh}" width="${bw-6}" height="${bh}" rx="3" style="fill:var(${col})"/><text x="${x+(bw-6)/2}" y="${h-pb-bh-4}" text-anchor="middle">${c}</text><text x="${x}" y="${h-6}">${lo+i*(hi-lo)/bins}</text>`});
  return o+'</svg>';
}
function lineChart(series,labels,{min,max,h=210,unit=''}={}){
  const w=640,pl=36,pr=16,pt=14,pb=24,all=series.flatMap(s=>s.v);
  min=min??Math.floor(Math.min(...all)-2);max=max??Math.ceil(Math.max(...all)+2);
  const X=i=>pl+i*(w-pl-pr)/(labels.length-1),Y=v=>h-pb-(v-min)/(max-min)*(h-pb-pt);
  let o=`<svg class="svgc" viewBox="0 0 ${w} ${h}" role="img">`;
  for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,y=Y(v);o+=`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}"/><text x="${pl-5}" y="${y+3}" text-anchor="end">${Math.round(v*10)/10}${unit}</text>`}
  labels.forEach((l,i)=>o+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${l}</text>`);
  series.forEach((s,si)=>{
    const pts=s.v.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    if(si===0)o+=`<polygon points="${X(0)},${h-pb} ${pts} ${X(s.v.length-1)},${h-pb}" style="fill:var(${s.color});opacity:.12"/>`;
    o+=`<polyline points="${pts}" fill="none" style="stroke:var(${s.color})" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=s.v.length-1;o+=`<circle cx="${X(li)}" cy="${Y(s.v[li])}" r="4.5" style="fill:var(${s.color});stroke:var(--surface)" stroke-width="2"/><text x="${X(li)}" y="${Y(s.v[li])-9}" text-anchor="end" style="fill:var(--ink);font-weight:500">${s.v[li]}${unit}</text>`;
  });
  return o+'</svg>';
}
function scatter(pts,{xl,yl,xmin,xmax,ymin,ymax,vline}){
  const w=640,h=300,pl=40,pr=14,pt=12,pb=34,X=v=>pl+(v-xmin)/(xmax-xmin)*(w-pl-pr),Y=v=>h-pb-(v-ymin)/(ymax-ymin)*(h-pb-pt);
  let o=`<svg class="svgc" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(yl)} against ${esc(xl)}">`;
  for(let i=0;i<=4;i++){const xv=xmin+(xmax-xmin)*i/4,yv=ymin+(ymax-ymin)*i/4;
    o+=`<line class="gl" x1="${X(xv)}" x2="${X(xv)}" y1="${pt}" y2="${h-pb}"/><text x="${X(xv)}" y="${h-pb+13}" text-anchor="middle">${Math.round(xv*10)/10}</text><line class="gl" x1="${pl}" x2="${w-pr}" y1="${Y(yv)}" y2="${Y(yv)}"/><text x="${pl-5}" y="${Y(yv)+3}" text-anchor="end">${Math.round(yv*10)/10}</text>`}
  if(vline!=null)o+=`<line x1="${X(vline)}" x2="${X(vline)}" y1="${pt}" y2="${h-pb}" stroke-dasharray="4 4" style="stroke:var(--muted)"/><text x="${X(vline)+4}" y="${pt+10}">${vline}% rule</text>`;
  pts.forEach(p=>o+=`<circle class="pt" data-act="open" data-v="${p.id}" cx="${X(p.x)}" cy="${Y(p.y)}" r="4.2" style="fill:var(${p.c});fill-opacity:.72"><title>${esc(p.t)}</title></circle>`);
  o+=`<text x="${(pl+w-pr)/2}" y="${h-4}" text-anchor="middle">${xl}</text><text x="10" y="${(pt+h-pb)/2}" transform="rotate(-90 10 ${(pt+h-pb)/2})" text-anchor="middle">${yl}</text>`;
  return o+'</svg>';
}
function donut(items,center){
  const r=54,C=2*Math.PI*r,t=items.reduce((a,i)=>a+i.v,0)||1;let off=0;
  let o=`<svg viewBox="0 0 140 140" width="150" height="150" role="img"><g transform="rotate(-90 70 70)">`;
  items.forEach(i=>{const len=i.v/t*C;o+=`<circle cx="70" cy="70" r="${r}" fill="none" stroke-width="18" style="stroke:var(${i.color})" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;off+=len});
  return o+`</g><text x="70" y="68" text-anchor="middle" style="font-family:var(--f-d);font-weight:700;font-size:24px;fill:var(--ink)">${center[0]}</text><text x="70" y="86" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${center[1]}</text></svg>`;
}
function gauge(v,size=130,label='of 100'){
  const r=size/2-10,C=2*Math.PI*r,col=scoreColor(v);
  return`<div class="gauge" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="10" style="stroke:var(--surface2)"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="10" stroke-linecap="round" style="stroke:var(${col})" stroke-dasharray="${v/100*C} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><div class="gv"><b class="num">${f1(v)}</b><span>${label}</span></div></div>`;
}
function radar(vals,refs,size=250){
  const n=vals.length,c=size/2,R0=size/2-38,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[c+Math.cos(a)*R0*v/100,c+Math.sin(a)*R0*v/100]};
  let o=`<svg class="svgc" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:auto" role="img">`;
  [25,50,75,100].forEach(g=>o+=`<polygon class="gl" fill="none" points="${vals.map((_,i)=>pt(i,g).join(',')).join(' ')}"/>`);
  vals.forEach((v,i)=>{const[x,y]=pt(i,112);o+=`<line class="gl" x1="${c}" y1="${c}" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}"/><text x="${x}" y="${y+3}" text-anchor="middle">${v.l}</text>`});
  o+=`<polygon points="${refs.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke-dasharray="4 3" style="stroke:var(--muted)" stroke-width="1.6"/>`;
  o+=`<polygon points="${vals.map((v,i)=>pt(i,v.v).join(',')).join(' ')}" style="fill:var(--accent);fill-opacity:.2;stroke:var(--accent)" stroke-width="2"/>`;
  return o+'</svg>';
}
function diverge(rows,{pos='--good',neg='--bad',fmt=v=>(v>0?'+':'')+v.toFixed(1)}={}){
  const mx=Math.max(...rows.map(r=>Math.abs(r.c)),.1);
  return rows.map(r=>`<div class="div-row" title="${esc(r.tip||'')}"><span>${esc(r.label)}</span><div class="tr"><div class="b" style="${r.c>=0?`left:50%;width:${r.c/mx*50}%;background:var(${pos})`:`right:50%;width:${-r.c/mx*50}%;background:var(${neg})`}"></div></div><b class="mono" style="text-align:right">${fmt(r.c)}</b></div>`).join('');
}
function tbl(cols,rows,{cls='',empty='Nothing to show.'}={}){
  if(!rows.length)return`<div class="tw"><div class="empty">${empty}</div></div>`;
  return`<div class="tw"><table class="${cls}"><thead><tr>${cols.map(c=>typeof c==='string'?`<th>${c}</th>`:`<th class="${c.srt?'srt':''}" ${c.srt?`data-act="sort" data-v="${c.srt}"`:''}>${c.h}${c.srt&&S.f.sort===c.srt?(S.f.dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
const PAGE=12;
function pager(total,id){
  const pages=Math.max(1,Math.ceil(total/PAGE));if(S.f.page>=pages)S.f.page=pages-1;
  return`<div class="pager"><span class="muted">Showing ${total?S.f.page*PAGE+1:0}–${Math.min(total,(S.f.page+1)*PAGE)} of ${total}</span><div class="row"><button class="btn sm" data-act="pg" data-v="-1" data-r="${id}" ${S.f.page<=0?'disabled':''}>Previous</button><span class="mono muted">${S.f.page+1} / ${pages}</span><button class="btn sm" data-act="pg" data-v="1" data-r="${id}" ${S.f.page>=pages-1?'disabled':''}>Next</button></div></div>`;
}

/* ===== student drawer: the explainable view ===== */
function openStudent(id){
  const s=byId(id);if(!s)return;
  const sd=scoreDrivers(s),ad=riskDrivers(s,'acad'),pd=riskDrivers(s,'plc'),acts=actionsFor(s);
  const radarV=PILLARS.map(p=>({l:p.short,v:s.p[p.k]})),radarR=PILLARS.map(p=>MEAN[p.k]);
  const drv=(arr,type)=>arr.filter(d=>d.c>.8).slice(0,3).map(d=>`<div class="li" style="padding:8px 0"><span class="pill ${type==='acad'?'high':'med'} plain">+${d.c.toFixed(1)}</span><div class="grow"><b>${esc(d.label)}</b><div class="muted" style="font-size:12.5px">${esc(detail(s,d.k))}${d.raw?'':` · cohort average ${r0(d.avg)}`}</div></div></div>`).join('')||`<p class="muted" style="padding:8px 0">No indicator is pulling this risk above the cohort average.</p>`;
  const iv=S.interventions.find(i=>i.sid===id&&i.status!=='Completed');
  $('#drawer').innerHTML=`<div class="scrim" data-act="dclose" data-scrim="1"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Student detail">
   <div class="row spread" style="align-items:flex-start"><div class="row" style="flex-wrap:nowrap"><div class="av" style="width:46px;height:46px">${ini(s.name)}</div><div><h2 style="font-size:22px">${esc(s.name)}</h2><div class="muted mono" style="font-size:12.5px">${s.id} · ${s.dept} · Sem ${s.sem} · Sec ${s.sec}</div></div></div><button class="iconbtn" data-act="dclose" aria-label="Close">${ic('x')}</button></div>
   <div class="row">${segPill(s.seg)}${riskPill(s.risk.acad).replace('">','">Academic: ')}${riskPill(s.risk.plc).replace('">','">Placement: ')}</div>
   <div class="card flat"><div class="row" style="gap:20px;flex-wrap:nowrap;align-items:center">${gauge(s.score)}<div class="grow" style="min-width:0"><div class="lbl">Student Success Score</div><p style="margin:4px 0 8px">${s.score>=MEAN.score?'Above':'Below'} the college average of ${f1(MEAN.score)} by <b>${f1(Math.abs(s.score-MEAN.score))}</b> points. ${s.delta>=0?`Up <b class="up">${s.delta}</b>`:`Down <b class="dn">${Math.abs(s.delta)}</b>`} over the last 4 weeks.</p><button class="btn sm" data-act="method">How is this calculated?</button></div></div></div>
   <div class="card flat">${cardH('Why this score','Each bar is that indicator’s contribution relative to the college average, in score points.')}${diverge(sd.map(d=>({label:d.label,c:d.c,tip:detail(s,d.k)})))}<div class="legend" style="margin-top:8px"><span><i style="background:var(--good)"></i>Lifts the score</span><span><i style="background:var(--bad)"></i>Pulls it down</span></div></div>
   <div class="card flat">${cardH('Why the risk flags','Top indicators pushing risk above the college average.')}<div class="lbl" style="margin-top:4px">Academic risk ${f1(s.acad)} ${riskPill(s.risk.acad)}</div>${drv(ad,'acad')}<div class="lbl" style="margin-top:12px">Placement risk ${f1(s.plcR)} ${riskPill(s.risk.plc)}</div>${drv(pd,'plc')}</div>
   <div class="card flat">${cardH('Profile against college average','Solid shape is this student, dashed is the cohort.')}${radar(radarV,radarR)}</div>
   <div class="card flat">${cardH('Unified record','One row per source, joined on roll number.')}<div class="stack" style="gap:6px">${PILLARS.map(p=>`<div class="row spread" style="font-size:13px;gap:8px"><span><span class="tag">${p.src}</span></span><span class="muted" style="text-align:right">${esc(detail(s,p.k))}</span></div>`).join('')}</div></div>
   <div class="card flat">${cardH('Subject attendance')}${hbars(s.subj.map(x=>({label:x.name,v:x.att,txt:x.att+'%',color:x.att<S.R.att?'--bad':'--c1'})),{max:100})}</div>
   <div class="card flat">${cardH('Recommended actions','Generated from the strongest risk drivers.')}${acts.length?acts.map(a=>`<div class="li" style="padding:8px 0">${ic('target',16)}<span>${esc(a.text)}</span></div>`).join(''):'<p class="muted">No action needed. Keep monitoring.</p>'}
     ${S.role==='student'?'':iv?`<div class="callout" style="margin-top:10px">Intervention ${iv.status.toLowerCase()} with ${esc(iv.mentor)}.</div>`:`<button class="btn primary" style="margin-top:10px" data-act="mkiv" data-v="${s.id}">${ic('plus',16)} Create intervention plan</button>`}</div>
  </aside></div>`;
}
function closeDrawer(){$('#drawer').innerHTML=''}
function methodModal(){
  modal(`<div class="row spread"><h2 style="font-size:22px">How the Student Success Score works</h2><button class="iconbtn" data-act="mclose" aria-label="Close">${ic('x')}</button></div>
  <p class="muted" style="margin:8px 0 14px">Seven indicator groups are scaled to 0–100 and combined as a weighted average. Weights are editable in AI Analytics.</p>
  ${tbl(['Indicator group','Built from','Weight'],PILLARS.map(p=>`<tr><td><b>${p.label}</b><div class="sub">${p.src} source</div></td><td>${p.desc}</td><td class="mono">${r0(S.W[p.k]/Object.values(S.W).reduce((a,b)=>a+b,0)*100)}%</td></tr>`))}
  <div class="stack" style="margin-top:14px;font-size:13.5px"><p><b>Success Score</b> = Σ weight × indicator group score.</p>
  <p><b>Academic risk</b> = 100 − (0.45 Academics + 0.30 Attendance + 0.15 LMS + 0.10 Feedback) + 4 per backlog (max 3). High at ${S.R.acHi}+, Medium at ${S.R.acMed}+.</p>
  <p><b>Placement risk</b> = 100 − (0.65 Placement + 0.25 Skills + 0.10 Engagement). High at ${S.R.plHi}+, Medium at ${S.R.plMed}+.</p>
  <p><b>Explainability</b>: each driver is its weight × the gap to the college average, so the bars add up to the difference from the average score.</p></div>`,true);

function detect(email){
  const m=String(email).trim().toLowerCase().match(/@(.+)$/);
  if(!m||!m[1])return{cls:'no',t:'Type your institutional email and PulseIQ finds your college.'};
  if(m[1]===COLLEGE.domain)return{cls:'',t:`${COLLEGE.name} detected`};
  if(COLLEGE.domain.startsWith(m[1]))return{cls:'no',t:'Keep typing…'};
  return{cls:'no',t:`${m[1]} is not a registered college domain`};
}

function findUser(email){
  const e=email.trim().toLowerCase();
  if(e===ME_ADMIN.email)return{role:'admin',name:ME_ADMIN.name,title:ME_ADMIN.title,email:e};
  const f=FACULTY.find(x=>x.email===e);if(f)return{role:'faculty',name:f.name,title:f.desig+', '+f.dept,email:e,dept:f.dept,fac:f};
  const s=STUDENTS.find(x=>x.email===e);if(s)return{role:'student',name:s.name,title:`${s.dept} · Sem ${s.sem}`,email:e,dept:s.dept,stu:s};
  return null;
}
FORM.login=f=>{
  const em=$('#lem').value.trim(),pw=$('#lpw').value;S.login.email=em;
  let err='';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))err='Enter a valid email address.';
  else if(em.toLowerCase().split('@')[1]!==COLLEGE.domain)err='This email domain is not registered with PulseIQ.';
  else if(pw.length<6)err='Password must be at least 6 characters.';
  else if(!findUser(em))err='No account found for this email. Ask your college admin to create one.';
  if(err){S.login.err=err;$('#lerr').textContent=err;return}
  S.login.err='';S.user=findUser(em);S.role=S.user.role;S.view='college';render();
};

function pwRules(p){return[['8 or more characters',p.length>=8],['An uppercase letter',/[A-Z]/.test(p)],['A number',/\d/.test(p)],['A symbol',/[^A-Za-z0-9]/.test(p)]]}

function forgotView(){

  let body='';
  if(st===1)body=`<form class="stack" data-form="fp1" novalidate><div class="fld"><label for="fpe">Institutional email</label><input class="inp" id="fpe" type="email" value="${esc(S.fp.email||'')}" placeholder="name@${COLLEGE.domain}"></div><div class="err" id="fperr"></div><button class="btn primary" style="justify-content:center">Send reset link</button></form>`;
  if(st===2)body=`<div class="stack"><div class="callout">A reset link was sent to <b>${esc(S.fp.email)}</b>. It expires in 30 minutes.</div><p class="hint">In this prototype no email is sent. Use the button to open the link.</p><button class="btn primary" data-act="fp2" style="justify-content:center">Open reset link</button></div>`;
  if(st===3)body=`<form class="stack" data-form="fp3" novalidate><div class="fld"><label for="np">New password</label><input class="inp" id="np" type="password" data-in="np" autocomplete="new-password"></div><div class="fld"><label for="np2">Confirm password</label><input class="inp" id="np2" type="password" autocomplete="new-password"></div><div id="pwr" style="font-size:13px;display:flex;flex-direction:column;gap:4px">${R.pwr()}</div><div class="err" id="fperr"></div><button class="btn primary" style="justify-content:center">Save password</button></form>`;
  if(st===4)body=`<div class="stack"><div class="callout">Your password has been updated. You can sign in now.</div><button class="btn primary" data-act="tologin" style="justify-content:center">Back to sign in</button></div>`;
  return`<div class="welc"><div class="card auth-card" style="padding:26px"><div class="brand" style="color:var(--ink);padding:0">${MARK(28)}PulseIQ</div><div><h1 style="font-size:24px">Reset your password</h1><p class="muted" style="margin-top:4px">Step ${st} of 4</p></div>${body}${st<4?`<button class="btn ghost sm" style="align-self:flex-start" data-act="tologin">Cancel</button>`:''}</div></div>`;
}

/* ===== shared at-risk table (A12, F04, F10) ===== */
const SORTS={risk:s=>Math.max(s.acad,s.plcR),score:s=>s.score,name:s=>s.name,att:s=>s.att,cgpa:s=>s.cgpa};
function filt(pool){
  const f=S.f;
  return pool.filter(s=>(f.dept==='All'||s.dept===f.dept)&&(f.sem==='All'||String(s.sem)===f.sem)&&(f.seg==='All'||s.seg===f.seg)&&
   (f.risk==='All'||(f.risk==='acad'&&s.risk.acad==='High')||(f.risk==='plc'&&s.risk.plc==='High')||(f.risk==='both'&&s.risk.acad==='High'&&s.risk.plc==='High')||(f.risk==='any'&&(s.risk.acad==='High'||s.risk.plc==='High')))&&
   (!f.q||(s.name+' '+s.id).toLowerCase().includes(f.q.toLowerCase())));
}
function topDriver(s){const d=[...riskDrivers(s,'acad'),...riskDrivers(s,'plc')].sort((a,b)=>b.c-a.c)[0];return d&&d.c>1?`${d.label}`:'None'}
R.tbl=()=>{
  const k=SORTS[S.f.sort]||SORTS.risk,rows=filt(S.pool()).sort((a,b)=>{const x=k(a),y=k(b);return(x>y?1:x<y?-1:0)*S.f.dir});
  const page=rows.slice(S.f.page*PAGE,(S.f.page+1)*PAGE);
  const cols=[{h:'Student',srt:'name'},'Class',{h:'Success score',srt:'score'},{h:'Academic risk',srt:'risk'},'Placement','Segment','Main driver','4-wk'];
  return`<div class="row spread" style="margin-bottom:10px"><span class="muted" id="rc"><b>${rows.length}</b> students match</span><button class="btn sm" data-act="copycsv">Copy list as CSV</button></div>`+
  tbl(cols,page.map(s=>`<tr class="clk" data-act="open" data-v="${s.id}"><td><b>${esc(s.name)}</b><div class="sub mono">${s.id}</div></td><td>${s.cls}</td><td style="min-width:130px">${scBar(s.score)}</td><td>${riskPill(s.risk.acad)}</td><td>${riskPill(s.risk.plc)}</td><td>${segPill(s.seg)}</td><td>${esc(topDriver(s))}</td><td class="mono ${s.delta>=0?'up':'dn'}">${s.delta>0?'+':''}${s.delta}</td></tr>`),{empty:'No students match these filters.'})+pager(rows.length,'tbl');
};
ACT.copycsv=()=>{const rows=filt(S.pool());copyText(csv(['Roll','Name','Class','Score','Academic risk','Placement risk','Segment'],rows.map(s=>[s.id,s.name,s.cls,s.score,s.risk.acad,s.risk.plc,SEGMAP[s.seg].label])),`Copied ${rows.length} rows`)};
function riskToolbar(depts=true){

  <div class="fld"><label for="fs">Semester</label><select class="sel" id="fs" data-in="ff" data-k="sem">${['All','3','5','7'].map(x=>`<option ${f.sem===x?'selected':''}>${x}</option>`).join('')}</select></div>

  <div class="chips" style="margin-top:12px" id="chips">${riskChips()}</div></div>`;

const riskChips=()=>[['All','All students'],['any','Any high risk'],['acad','High academic risk'],['plc','High placement risk'],['both','Both']].map(([k,l])=>`<button class="chip ${S.f.risk===k?'on':''}" data-act="rk" data-v="${k}">${l}</button>`).join('');

/* ===== A01 dashboard ===== */
function corr(x,y){const mx=mean(x),my=mean(y);let n=0,a=0,b=0;x.forEach((v,i)=>{n+=(v-mx)*(y[i]-my);a+=(v-mx)**2;b+=(y[i]-my)**2});return n/Math.sqrt(a*b||1)}
function insights(){
  const low=STUDENTS.filter(s=>s.att<S.R.att),lowHi=low.filter(s=>s.risk.acad==='High').length;
  const gap=STUDENTS.filter(s=>s.seg==='gap'),gapC=mean(gap.map(s=>s.plc.code));
  const rate=DEPTS.map(d=>{const p=STUDENTS.filter(s=>s.dept===d.code);return{d:d.code,r:p.filter(s=>s.risk.acad==='High'||s.risk.plc==='High').length/p.length}}).sort((a,b)=>b.r-a.r)[0];
  const r=corr(STUDENTS.map(s=>s.p.lms),STUDENTS.map(s=>s.cgpa));
  const dn=STUDENTS.filter(s=>s.delta<=-3).length;
  return[
   {k:'bad',t:`${low.length} students (${pc(low.length/STUDENTS.length*100)}) are below the ${S.R.att}% attendance rule. ${pc(lowHi/low.length*100)} of them already carry a High academic risk flag.`},
   {k:'warn',t:`${gap.length} students have strong academics but weak placement readiness. Their average coding score is ${r0(gapC)}, against ${r0(mean(STUDENTS.map(s=>s.plc.code)))} for the college.`},
   {k:'warn',t:`${rate.d} has the highest share of students with a High risk flag (${pc(rate.r*100)}). Start department reviews there.`},
   {k:'',t:`LMS activity tracks CGPA closely (r = ${r.toFixed(2)}). Falling LMS logins are an early warning that shows up weeks before marks do.`},
   {k:'bad',t:`${dn} students lost 3 or more score points in the last 4 weeks.`}];
}
VIEWS.A01=()=>{
  const N=STUDENTS.length,hi=STUDENTS.filter(s=>s.risk.acad==='High'||s.risk.plc==='High'),pass=STUDENTS.filter(s=>s.backlogs===0).length,wk=weekly();
  const top=[...STUDENTS].sort((a,b)=>Math.max(b.acad,b.plcR)-Math.max(a.acad,a.plcR)).slice(0,6);
  const byDept=DEPTS.map(d=>{const p=STUDENTS.filter(s=>s.dept===d.code);return{d:d.code,p,hi:p.filter(s=>s.risk.acad==='High'||s.risk.plc==='High').length,med:p.filter(s=>!(s.risk.acad==='High'||s.risk.plc==='High')&&(s.risk.acad==='Medium'||s.risk.plc==='Medium')).length}});
  const segC=SEGS.map(g=>({g,n:STUDENTS.filter(s=>s.seg===g.k).length}));
  return ph('A01',`Good evening, ${S.user.name.split(' ')[1]}`,`${TERM} · Week 8. Data last synced 18 minutes ago from 7 sources.`,`<button class="btn" data-act="go" data-v="A16">${ic('refresh',16)} Sync status</button><button class="btn primary" data-act="go" data-v="A12">${ic('alert',16)} Review at-risk students</button>`)+
  `<div class="grid g6">${kpi('Students',N,STUDENTS.filter(s=>s.active).length+' active')}${kpi('Faculty',FACULTY.length,'across '+DEPTS.length+' departments')}${kpi('Departments',DEPTS.length,'3 batches each')}${kpi('Avg attendance',pc(MEAN.att),`${STUDENTS.filter(s=>s.att<S.R.att).length} below ${S.R.att}%`)}${kpi('Pass percentage',pc(pass/N*100),'no active backlogs')}${kpi('Avg success score',f1(MEAN.score),`<span class="${wk.sc[7]>=wk.sc[3]?'up':'dn'}">${wk.sc[7]>=wk.sc[3]?'▲':'▼'} ${f1(Math.abs(wk.sc[7]-wk.sc[3]))} in 4 weeks</span>`)}</div>
  <div class="grid g-main"><div class="card">${cardH(`${hi.length} students need intervention`,'Highest combined risk. Select a row to see why.',`<button class="btn sm" data-act="rkgo" data-v="any">View all ${hi.length}</button>`)}
   ${tbl(['Student','Score','Academic','Placement','Main driver'],top.map(s=>`<tr class="clk" data-act="open" data-v="${s.id}"><td><b>${esc(s.name)}</b><div class="sub">${s.cls}</div></td><td class="mono">${f1(s.score)}</td><td>${riskPill(s.risk.acad)}</td><td>${riskPill(s.risk.plc)}</td><td>${esc(topDriver(s))}</td></tr>`))}</div>
   <div class="card">${cardH('AI risk summary','Generated from the combined data.')}<div class="stack" style="gap:10px">${insights().map(i=>`<div class="callout ${i.k}">${esc(i.t)}</div>`).join('')}</div></div></div>
  <div class="grid g3"><div class="card">${cardH('Success score distribution','Students per 10-point band.')}${hist(STUDENTS.map(s=>s.score))}</div>
   <div class="card">${cardH('Risk by department','Share of students with any High flag or Medium flag.')}<div class="stack" style="gap:12px">${byDept.map(x=>`<div><div class="row spread" style="font-size:13px;margin-bottom:4px"><b>${x.d}</b><span class="mono muted">${x.hi} high · ${x.med} medium · ${x.p.length-x.hi-x.med} low</span></div>${stacked([{label:'High',v:x.hi,color:'--bad'},{label:'Medium',v:x.med,color:'--warn'},{label:'Low',v:x.p.length-x.hi-x.med,color:'--good'}])}</div>`).join('')}</div></div>
   <div class="card">${cardH('Student segments','Select a segment to see its students.')}${hbars(segC.map(({g,n})=>({label:g.label,v:n,color:g.color,act:'sego',key:g.k})),{max:Math.max(...segC.map(x=>x.n))})}</div></div>
  <div class="grid g2"><div class="card">${cardH('Average attendance by week','Percent across all students.')}${lineChart([{v:wk.att,color:'--c1'}],WEEKS,{unit:'%'})}</div><div class="card">${cardH('Students with High academic risk','Count by week. Rising since week 4.')}${lineChart([{v:wk.hi,color:'--bad'}],WEEKS)}</div></div>`;
};

/* ===== A11 AI analytics ===== */
const NOTE=()=>`STUDENT SUCCESS SCORE: a note\n\nIndicators (each scaled 0-100): ${PILLARS.map(p=>`${p.label} (${p.desc}, weight ${r0(S.W[p.k]/Object.values(S.W).reduce((a,b)=>a+b,0)*100)}%)`).join('; ')}.\n\nScore = weighted average of the seven indicator groups. Academic risk = 100 - (0.45 Academics + 0.30 Attendance + 0.15 LMS + 0.10 Feedback) + 4 per backlog (max 3). Placement risk = 100 - (0.65 Placement + 0.25 Skills + 0.10 Engagement). Flags use College thresholds (High ${S.R.acHi}/${S.R.plHi}, Medium ${S.R.acMed}/${S.R.plMed}).\n\nExplainability: each driver = weight x (student indicator - college average), so contributions sum to the gap from the average score.\n\nSegments: Critical support, Academic strong with placement gap, Placement-ready with academics slipping, Disengaged, Star performers, Steady core.\n\nCleaning: nulls imputed with department or class medians, duplicate IDs merged on latest record, out-of-range marks capped, every fix logged.`;
R.modelOut=()=>{
  const any=STUDENTS.filter(s=>s.risk.acad==='High'||s.risk.plc==='High').length;
  return`<div class="grid g3" style="margin-bottom:10px">${kpi('Average score',f1(MEAN.score))}${kpi('Std deviation',f1(Math.sqrt(mean(STUDENTS.map(s=>(s.score-MEAN.score)**2)))))}${kpi('Top 20% cutoff',f1(SC_STAR),'Star performer line')}</div>${hist(STUDENTS.map(s=>s.score))}`;
};
function wlabels(){const tw=Object.values(S.W).reduce((a,b)=>a+b,0)||1;PILLARS.forEach(p=>{const e=$('#wl-'+p.k);if(e)e.textContent=r0(S.W[p.k]/tw*100)+'%'})}
INP.w=t=>{S.W[t.dataset.k]=+t.value;recompute(S.W,S.R);wlabels();upd('modelOut');upd('segcards')};
ACT.wreset=()=>{S.W={...S0.W};recompute(S.W,S.R);render()};
R.segcards=()=>SEGS.map(g=>{const p=STUDENTS.filter(s=>s.seg===g.k);return`<div class="card flat stack" style="gap:8px"><div class="seg"><i style="background:var(${g.color})"></i><div><b>${g.label}</b><div class="mono muted" style="font-size:12px">${p.length} students · avg score ${p.length?f1(mean(p.map(s=>s.score))):'–'}</div></div></div><p class="muted" style="font-size:13px">${g.desc}</p><p style="font-size:13px"><b>Action:</b> ${g.action}</p><button class="btn sm" style="align-self:flex-start" data-act="sego" data-v="${g.k}">View students</button></div>`}).join('');
VIEWS.A11=()=>{
  const hiS=STUDENTS.filter(s=>s.risk.acad==='High'||s.risk.plc==='High'),rest=STUDENTS.filter(s=>!(s.risk.acad==='High'||s.risk.plc==='High'));
  const sep=PILLARS.map(p=>({p,a:mean(hiS.map(s=>s.p[p.k])),b:mean(rest.map(s=>s.p[p.k]))})).sort((x,y)=>(y.b-y.a)-(x.b-x.a));
  const pts=STUDENTS.map(s=>({id:s.id,x:s.att,y:s.cgpa,c:s.risk.acad==='High'?'--bad':s.risk.acad==='Medium'?'--warn':'--c1',t:`${s.name}: attendance ${s.att}%, CGPA ${s.cgpa}`}));
  const tw=Object.values(S.W).reduce((a,b)=>a+b,0)||1;
  return ph('A11','AI Analytics','College-wide drivers, segments and a score model you can tune. All charts update live.',`<button class="btn" data-act="method">How scoring works</button><button class="btn" data-act="copynote">Copy score note</button>`)+
  `<div class="grid g-main"><div class="card">${cardH('Score model studio','Change the weights and watch every score, flag and segment recalculate.',`<button class="btn sm" data-act="wreset">Reset to default</button>`)}
    <div class="grid g2" style="gap:6px 24px">${PILLARS.map(p=>`<div class="fld" style="gap:2px"><div class="row spread"><label for="w-${p.k}" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">${p.label}</label><b class="mono" id="wl-${p.k}">${r0(S.W[p.k]/tw*100)}%</b></div><input type="range" id="w-${p.k}" min="0" max="40" step="1" value="${r0(S.W[p.k]*100)}" data-in="wr" data-k="${p.k}"><span class="hint">${p.desc}</span></div>`).join('')}</div></div>
   <div class="card" id="modelOut">${R.modelOut()}</div></div>
  <div class="grid g2"><div class="card">${cardH('What separates at-risk students','Average indicator score: students with a High flag against everyone else.')}${sep.map(x=>`<div class="hb" style="grid-template-columns:minmax(90px,140px) minmax(0,1fr) 70px"><span>${x.p.label}</span><div><div class="tr" style="margin-bottom:3px"><div class="fl" style="width:${x.b}%;background:var(--c5)"></div></div><div class="tr"><div class="fl" style="width:${x.a}%;background:var(--bad)"></div></div></div><b class="mono dn">−${r0(x.b-x.a)} pts</b></div>`).join('')}<div class="legend" style="margin-top:8px"><span><i style="background:var(--c5)"></i>Not flagged</span><span><i style="background:var(--bad)"></i>High risk</span></div></div>
   <div class="card">${cardH('Attendance against CGPA','Each dot is a student. Select a dot to open the student.')}${scatter(pts,{xl:'Overall attendance %',yl:'CGPA',xmin:30,xmax:100,ymin:4,ymax:10,vline:S.R.att})}<div class="legend"><span><i style="background:var(--bad)"></i>High academic risk</span><span><i style="background:var(--warn)"></i>Medium</span><span><i style="background:var(--c1)"></i>Low</span></div></div></div>
  <div class="card">${cardH('Student segments','Groups that call for different interventions.')}<div class="grid g3" id="segcards">${R.segcards()}</div></div>
  <div class="card">${cardH('Indicator strength by department','Average indicator score. Green cells are strengths, red cells are gaps.')}<div class="tw"><table class="heat"><thead><tr><th>Department</th>${PILLARS.map(p=>`<th style="text-align:center">${p.short}</th>`).join('')}<th style="text-align:center">Score</th></tr></thead><tbody>${DEPTS.map(d=>{const p=STUDENTS.filter(s=>s.dept===d.code);return`<tr><td><b>${d.code}</b></td>${[...PILLARS.map(x=>mean(p.map(s=>s.p[x.k]))),mean(p.map(s=>s.score))].map(v=>{const t=cl((v-50)/30*100,0,100);return`<td style="background:color-mix(in srgb,var(--good-soft) ${t}%,var(--bad-soft))">${r0(v)}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div></div>`;
};

const PCLS=v=>/^(Active|Published|Approved|Completed|Present|Resolved|Verified|Enrolled|Done|OK|Locked|Responded|Held)$/.test(v)?'good':/^(Inactive|Rejected|Failed|Shortage|Detained)$/.test(v)?'bad':/^(Pending|Draft|Under review|In progress|Planned|Open|Scheduled|On hold|Editable)$/.test(v)?'warn':'acc';
const gdata=id=>{const g=GEN[id];if(!g.data)g.data=g.rows();return g.data};
function gfilt(id){const g=GEN[id],f=S.f;return gdata(id).filter(r=>(f.dept==='All'||!g.filter||String(r[g.filter])===f.dept)&&(!f.q||Object.values(r).join(' ').toLowerCase().includes(f.q.toLowerCase())))}
R.gstats=()=>{const g=GEN[S.route];return g.stats?`<div class="grid g4">${g.stats(gdata(S.route)).map(([k,v,s])=>kpi(k,v,s||'')).join('')}</div>`:''};
R.gtbl=()=>{
  const id=S.route,g=GEN[id],rows=gfilt(id),all=gdata(id),page=rows.slice(S.f.page*PAGE,(S.f.page+1)*PAGE);
  return tbl(g.cols.map(c=>c.h),page.map(r=>{const gi=all.indexOf(r);return`<tr class="${g.open?'clk':''}" ${g.open?`data-act="open" data-v="${r[g.open]}"`:''}>${g.cols.map(c=>{const v=r[c.k];
    if(c.tog)return`<td><button class="pill ${PCLS(v)}" style="border:0;cursor:pointer" data-act="gtog" data-v="${gi}" title="Click to change">${esc(v)}</button></td>`;
    if(c.pill)return`<td><span class="pill ${PCLS(v)}">${esc(v)}</span></td>`;
    if(c.btn)return`<td>${c.btn(r,gi)}</td>`;
    return`<td class="${c.m?'mono':''}" ${c.w?`style="min-width:${c.w}px"`:''}>${esc(v)}</td>`}).join('')}</tr>`}),{empty:'No records match.'})+pager(rows.length,'gtbl');
};
ACT.gtog=t=>{const g=GEN[S.route],r=gdata(S.route)[+t.dataset.v],k=g.cols.find(c=>c.tog).k,cy=g.cycle,i=cy.indexOf(r[k]);r[k]=cy[(i+1)%cy.length];upd('gtbl');upd('gstats')};
INP.gq=t=>{S.f.q=t.value;S.f.page=0;upd('gtbl')};
INP.gf=t=>{S.f.dept=t.value;S.f.page=0;upd('gtbl')};
function genView(id){
  const g=GEN[id],opts=g.filter?[...new Set(gdata(id).map(r=>String(r[g.filter])))].sort():[];
  return ph(id,g.title,g.sub,(g.extra||'')+(g.add?`<button class="btn primary" data-act="gadd">${ic('plus',16)} ${g.add.label}</button>`:''))+
   `<div id="gstats">${R.gstats()}</div><div class="card flat"><div class="toolbar"><div class="fld grow"><label for="gq">Search</label><input class="inp" id="gq" data-in="gq" placeholder="Search this list" value="${esc(S.f.q)}"></div>${g.filter?`<div class="fld"><label for="gf">${g.filterLabel||'Filter'}</label><select class="sel" id="gf" data-in="gf"><option value="All">All</option>${opts.map(o=>`<option ${S.f.dept===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`:''}<button class="btn" data-act="gcopy">Copy CSV</button></div></div><div id="gtbl">${R.gtbl()}</div>`;
}
ACT.gcopy=()=>{const g=GEN[S.route],rows=gfilt(S.route);copyText(csv(g.cols.filter(c=>!c.btn).map(c=>c.h),rows.map(r=>g.cols.filter(c=>!c.btn).map(c=>r[c.k]))),`Copied ${rows.length} rows`)};
ACT.gadd=()=>{const g=GEN[S.route];modal(`<form class="stack" data-form="gadd" novalidate><div class="row spread"><h2 style="font-size:20px">${g.add.label}</h2><button type="button" class="iconbtn" data-act="mclose" aria-label="Close">${ic('x')}</button></div>${g.add.fields.map(f=>`<div class="fld"><label for="ga-${f.k}">${f.l}</label>${f.o?`<select class="sel" id="ga-${f.k}">${f.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:f.t==='area'?`<textarea class="txt" id="ga-${f.k}"></textarea>`:`<input class="inp" id="ga-${f.k}" type="${f.t||'text'}">`}</div>`).join('')}<div class="err" id="gerr"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="mclose">Cancel</button><button class="btn primary">Save</button></div></form>`)};
FORM.gadd=()=>{const g=GEN[S.route],row={...(g.add.def||{})};for(const f of g.add.fields){const v=$('#ga-'+f.k).value.trim();if(!v&&!f.opt){$('#gerr').textContent=`${f.l} is required.`;return}row[f.k]=v}if(g.add.after)g.add.after(row);gdata(S.route).unshift(row);closeModal();upd('gtbl');upd('gstats');toast('Saved')};

 <form class="card stack" data-form="saveprof" novalidate>${cardH('Editable details')}<div class="fld"><label for="fp-p">Phone</label><input class="inp" id="fp-p" value="98480 12345"></div><div class="fld"><label for="fp-o">Office hours</label><input class="inp" id="fp-o" value="Tue and Thu, 3:30 to 5:00 pm, Room 2-14"></div><button class="btn primary" style="align-self:flex-start">Save</button></form></div>`};

const me=()=>S.user.stu;

VIEWS.S01=()=>{
  const s=me(),sd=scoreDrivers(s),neg=sd.filter(d=>d.c<0).slice(0,2),pos=sd.filter(d=>d.c>0).slice(0,2),low=s.subj.filter(x=>x.att<S.R.att),acts=actionsFor(s);
  return ph('S01',`Hi, ${s.name.split(' ')[0]}`,`${s.dept} · Semester ${s.sem} · Section ${s.sec} · ${s.id}`)+
  `<div class="grid g-main"><div class="card"><div class="row" style="gap:24px;align-items:center">${gauge(s.score,150)}<div class="grow" style="min-width:200px"><div class="lbl">Your Student Success Score</div><p style="font-size:16px;margin:6px 0">${s.score>=MEAN.score?'Above':'Below'} the college average (${f1(MEAN.score)}). Rank <b>${cohortRank(s)}</b> of ${STUDENTS.filter(x=>x.cls===s.cls).length} in your class.</p><div class="row">${segPill(s.seg)}<button class="btn sm" data-act="go" data-v="S07">See why</button></div></div></div></div>
  <div class="card">${cardH('This week')}<div class="stack" style="gap:8px">${neg[0]?`<div class="callout warn"><b>${neg[0].label}</b> is holding your score back by ${Math.abs(neg[0].c).toFixed(1)} points.</div>`:''}${pos[0]?`<div class="callout"><b>${pos[0].label}</b> is lifting your score by ${pos[0].c.toFixed(1)} points.</div>`:''}${low.length?`<div class="callout bad">${low.length} subject${low.length>1?'s are':' is'} below ${S.R.att}% attendance.</div>`:''}</div></div></div>
  <div class="grid g4">${kpi('Attendance',s.att+'%',s.att<S.R.att?'Below the '+S.R.att+'% rule':'Within the rule',s.att<S.R.att?'dn':'up')}${kpi('CGPA',s.cgpa,s.backlogs?s.backlogs+' backlog(s)':'No backlogs')}${kpi('Internal marks',s.internal+'%','average this semester')}${kpi('Placement readiness',r0(s.p.placement),'out of 100')}</div>
  <div class="grid g2"><div class="card">${cardH('Attendance by subject')}${hbars(s.subj.map(x=>({label:x.name,v:x.att,txt:x.att+'%',color:x.att<S.R.att?'--bad':'--c1'})),{max:100})}</div><div class="card">${cardH('Best next steps','Based on what moves your score the most.')}${acts.map(a=>`<div class="li" style="padding:9px 0">${ic('target',16)}<span>${esc(a.text)}</span></div>`).join('')||'<p class="muted">Nothing urgent. Keep going.</p>'}<button class="btn sm" style="margin-top:8px" data-act="go" data-v="S13">Try the what-if planner</button></div></div>`;
};
VIEWS.S02=()=>{const s=me();return ph('S02','My Profile','Personal and academic details.')+`<div class="grid g2"><div class="card stack"><div class="row" style="gap:14px"><div class="av" style="width:56px;height:56px;font-size:20px">${ini(s.name)}</div><div><h2 style="font-size:20px">${esc(s.name)}</h2><div class="muted mono">${s.id}</div></div></div>${[['Department',DEPTS.find(d=>d.code===s.dept).name],['Batch',s.batch],['Semester',s.sem],['Section',s.sec],['Class',s.cls],['Mentor',s.mentor]].map(([k,v])=>`<div class="row spread"><span class="muted">${k}</span><span>${esc(v)}</span></div>`).join('')}</div>

 return ph('S03','My Attendance','Subject-wise attendance and how many classes you need to get back above the rule.')+`<div class="grid g3">${kpi('Overall',s.att+'%',s.att<S.R.att?'Below the rule':'Within the rule',s.att<S.R.att?'dn':'up')}${kpi('Subjects below rule',s.subj.filter(x=>x.att<S.R.att).length)}${kpi('Rule',S.R.att+'%','set by the college')}</div>

VIEWS.S04=()=>{const s=me();return ph('S04','My Marks','Published internal marks and assignment scores.')+`<div class="card">${tbl(['Subject','Mid-1 /30','Mid-2 /30','Assignment /10','Total /70','%'],s.subj.map(x=>{const t=x.mid1+x.mid2+x.asg,p=t/70*100;return`<tr><td>${x.name}<div class="sub">${x.fac}</div></td><td class="mono">${x.mid1}</td><td class="mono">${x.mid2}</td><td class="mono">${x.asg}</td><td class="mono"><b>${t}</b></td><td class="mono ${p<50?'dn':''}">${r0(p)}%</td></tr>`}))}<p class="hint" style="margin-top:10px">Only marks published by your faculty are shown.</p></div>`};
VIEWS.S05=()=>{const s=me(),h=[...s.hist,s.cgpa];return ph('S05','Semester Results','Semester GPA and cumulative CGPA.')+`<div class="grid g-main"><div class="card">${cardH('GPA by semester')}${lineChart([{v:h,color:'--c1'}],h.map((_,i)=>'S'+(i+1)),{min:4,max:10})}</div><div class="card">${cardH('Results')}${tbl(['Semester','GPA','Result'],h.map((g,i)=>`<tr><td>Semester ${i+1}${i===h.length-1?' (so far)':''}</td><td class="mono">${f1(g)}</td><td><span class="pill ${g>=6?'good':'bad'}">${g>=6?'Pass':'Needs attention'}</span></td></tr>`))}<div class="row spread" style="margin-top:12px"><b>CGPA</b><b class="mono" style="font-size:20px">${s.cgpa}</b></div></div></div>`};
VIEWS.S06=()=>{const s=me(),h=[...s.hist,s.cgpa],ranked=[...s.subj].map(x=>({...x,p:(x.mid1+x.mid2+x.asg)/70*100})).sort((a,b)=>b.p-a.p);
 return ph('S06','Academic Progress','Trends, strengths and weak areas.')+`<div class="grid g2"><div class="card">${cardH('Profile against college average','Dashed line is the average student.')}${radar(PILLARS.map(p=>({l:p.short,v:s.p[p.k]})),PILLARS.map(p=>MEAN[p.k]))}</div><div class="stack"><div class="card">${cardH('Strengths')}${ranked.slice(0,2).map(x=>`<div class="row spread" style="padding:6px 0"><span>${x.name}</span><b class="mono up">${r0(x.p)}%</b></div>`).join('')}</div><div class="card">${cardH('Weak areas')}${ranked.slice(-2).reverse().map(x=>`<div class="row spread" style="padding:6px 0"><span>${x.name}</span><b class="mono dn">${r0(x.p)}%</b></div>`).join('')}</div><div class="card">${cardH('GPA trend')}${h.length>1?lineChart([{v:h,color:'--c1'}],h.map((_,i)=>'S'+(i+1)),{min:4,max:10,h:150}):''}</div></div></div>`};
VIEWS.S07=()=>{const s=me(),sd=scoreDrivers(s),ad=riskDrivers(s,'acad'),pd=riskDrivers(s,'plc');
 const say=(arr,t)=>{const x=arr.filter(d=>d.c>.8).slice(0,2);return x.length?`Your ${t} risk is ${s.risk[t==='academic'?'acad':'plc'].toLowerCase()}. The biggest reasons: ${x.map(d=>`${d.label.toLowerCase()} (${detail(s,d.k)})`).join(' and ')}.`:`Your ${t} risk is low. Nothing is pulling it up.`};
 return ph('S07','AI Performance Insights','Why your score is what it is, in plain language.',`<button class="btn" data-act="method">How is this calculated?</button>`)+`<div class="grid g-main"><div class="card">${cardH('What moves your score','Points relative to the college average.')}${diverge(sd.map(d=>({label:d.label,c:d.c,tip:detail(s,d.k)})))}<div class="legend" style="margin-top:8px"><span><i style="background:var(--good)"></i>Helps you</span><span><i style="background:var(--bad)"></i>Holds you back</span></div></div>
 <div class="stack"><div class="card">${gauge(s.score,120)}</div><div class="callout ${s.risk.acad==='Low'?'':'warn'}">${esc(say(ad,'academic'))}</div><div class="callout ${s.risk.plc==='Low'?'':'warn'}">${esc(say(pd,'placement'))}</div></div></div>`};
S.wi={att:0,code:0,asg:0,cert:0};
R.wi=()=>{const s=me(),c=JSON.parse(JSON.stringify(s)),w=S.wi;
 c.att=Math.min(99,s.att+w.att);c.plc.code=Math.min(98,s.plc.code+w.code);c.lms.assign=Math.min(100,s.lms.assign+w.asg);c.eng.certs=Math.min(8,s.eng.certs+w.cert);
 const p=pillars(c),tw=Object.values(S.W).reduce((a,b)=>a+b,0),ns=PILLARS.reduce((a,x)=>a+S.W[x.k]*p[x.k],0)/tw,d=ns-s.score;

 return ph('S13','Learning Recommendations','Study priorities and a what-if planner for your Success Score.')+`<div class="grid g2"><div class="card">${cardH('Priorities for you','Ordered by impact on your risk flags.')}${acts.map((a,i)=>`<div class="li"><span class="pill acc plain">${i+1}</span><div class="grow"><b style="font-weight:500">${esc(a.text)}</b><div class="muted" style="font-size:12.5px">${esc(detail(s,a.k))}</div></div></div>`).join('')||'<p class="muted">Nothing urgent.</p>'}${(()=>{const w=[...s.subj].map(x=>({...x,p:(x.mid1+x.mid2+x.asg)/70*100})).sort((a,b)=>a.p-b.p)[0];return`<div class="callout" style="margin-top:12px">Weakest subject: <b>${w.name}</b> at ${r0(w.p)}%. Ask ${esc(w.fac)} for the previous question papers.</div>`})()}</div>
 <div class="card stack">${cardH('What if I improved…','Move the sliders to see the projected score.')}${[['att','Overall attendance',0,20,'pts'],['code','Coding score',0,40,'pts'],['asg','LMS assignment completion',0,40,'pts'],['cert','Certifications',0,4,'']].map(([k,l,mn,mx])=>`<div class="fld" style="gap:2px"><div class="row spread"><label for="wi-${k}" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">${l}</label><b class="mono" id="wiv-${k}">+0</b></div><input type="range" id="wi-${k}" min="${mn}" max="${mx}" value="0" data-in="wi" data-k="${k}"></div>`).join('')}<div id="wi">${R.wi()}</div></div></div>`};
